name: Sass

permissions:
  contents: read

on:
  pull_request:

jobs:
  sass:
    name: Dart Sass ${{ matrix.package-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        package-version:
          # Earliest release supported by GOV.UK frontend v6.0.0
          - 1.79.0

          # Release with `import` deprecated
          - 1.80.0

          # Dart Sass latest major version
          - latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Install packages
        env:
          SASS_PACKAGE_VERSION: ${{ matrix.package-version }}
        run: |
          npm install --global "sass@${SASS_PACKAGE_VERSION}"
          npm run setup
          sass --version

      - name: Check compilation
        run: |
          mkdir -p .tmp
          time sass src/moj/all.scss --load-path . --load-path node_modules > .tmp/check.css

      - name: Check load paths
        run: |
          mkdir -p .tmp
          time sh -c 'echo "@import "\""moj/all"\"";" | sass --stdin --load-path . --load-path node_modules --load-path src > .tmp/check1.css'
          time sh -c 'echo "@forward "\""moj/all"\"";" | sass --stdin --load-path . --load-path node_modules --load-path src > .tmp/check2.css'
          time sh -c 'echo "@use "\""moj/all"\"" as *;" | sass --stdin --load-path . --load-path node_modules --load-path src > .tmp/check3.css'

      # Check output for uncompiled Sass
      - name: Check output
        run: |
          failed=0

          for file in .tmp/check.css .tmp/check{1..3}.css; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing Sass output $file"
              failed=1
            elif grep -F -n "\$moj-" "$file"; then
              echo "::error::Uncompiled Sass found in $file"
              failed=1
            fi
          done

          exit $failed
