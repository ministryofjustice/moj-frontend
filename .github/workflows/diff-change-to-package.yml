name: Diff changes to npm package

on:
  pull_request:
    paths:
      - 'src/**'
      - 'gulp/**'
      - 'gulpfile.js'
      - 'postcss.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.browserslistrc'

permissions:
  pull-requests: write

jobs:
  generate-diff:
    name: Generate diff
    runs-on: ubuntu-latest

    # Skip when token write permissions are unavailable on forks
    if: ${{ github.event.pull_request && !github.event.pull_request.head.repo.fork }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Need full history to checkout the base branch to compare

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc

      - name: Set up git identity
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Set up diff drivers
        run: |
          npm install -g js-beautify
          git config diff.minjs.textconv "js-beautify --editorconfig --type js"
          git config diff.mincss.textconv "js-beautify --editorconfig --type css"

      - name: Generate diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          WORKSPACE: ${{ github.workspace }}
        run: |
          bin/package-diff.sh "${BASE_REF}" "${WORKSPACE}"

      - name: Save npm package diffs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Package diff
          path: .cache/diff/package/*.diff
          if-no-files-found: ignore

      - name: Summarize npm package diffs
        run: |
          {
            echo '# Generated npm package diffs'
            echo
            echo '```text'
            find .cache/diff/package -maxdepth 1 -type f -name '*.diff' -print
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Add comment to PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          DIFF_TYPE: package
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node bin/comment-diff.mjs
