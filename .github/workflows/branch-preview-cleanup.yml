name: Cleanup branch preview

on:
  pull_request_target:
    types: [closed]

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ECR_NAME: ${{ secrets.ECR_NAME }}
  KUBE_CLUSTER: ${{ secrets.KUBE_CLUSTER }}
  KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}

jobs:
  cleanup-preview:
    runs-on: ubuntu-latest
    env:
      SHOULD_CLEANUP: ${{ contains(github.event.pull_request.labels.*.name, 'preview: active 👀') }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - run: |
          if [[ "${SHOULD_CLEANUP}" == 'true' ]]; then
            set -euo pipefail
            printf '%s\n' "${KUBE_CERT}" > ca.crt
            kubectl config set-cluster "${KUBE_CLUSTER}" --certificate-authority=./ca.crt --server="https://${KUBE_CLUSTER}"
            kubectl config set-credentials deploy-user --token="${KUBE_TOKEN}"
            kubectl config set-context "${KUBE_CLUSTER}" --cluster="${KUBE_CLUSTER}" --user=deploy-user --namespace="${KUBE_NAMESPACE}"
            kubectl config use-context "${KUBE_CLUSTER}"
            kubectl delete deployment "moj-frontend-pr-${PR_NUMBER}" -n "${KUBE_NAMESPACE}"
            kubectl delete service "moj-frontend-service-pr-${PR_NUMBER}" -n "${KUBE_NAMESPACE}"
            kubectl delete service "express-app-pr-${PR_NUMBER}" -n "${KUBE_NAMESPACE}"
            kubectl delete ingress "moj-frontend-ingress-pr-${PR_NUMBER}" -n "${KUBE_NAMESPACE}"
          else
            echo 'Preview cleanup skipped: the pull request has no active preview label.'
          fi
        env:
          KUBE_CERT: ${{ secrets.KUBE_CERT }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
          KUBE_CLUSTER: ${{ secrets.KUBE_CLUSTER }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Remove preview: active label"
        if: env.SHOULD_CLEANUP == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: 'gh pr edit "${PR_NUMBER}" --remove-label "preview: active 👀"'
      - name: Report skipped preview cleanup
        if: env.SHOULD_CLEANUP != 'true'
        run: echo 'Preview cleanup not required; no active preview label was found.' >> "$GITHUB_STEP_SUMMARY"
